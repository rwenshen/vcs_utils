[loggers]
keys=root,vcs_utils

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=WARNING
handlers=console

[logger_vcs_utils]
level=INFO
handlers=console
qualname=vcs_utils
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=default
args=(sys.stdout,)

[formatter_default]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
